name: idea-to-jira

x-openclaw-common: &openclaw-common
  image: idea-to-jira-openclaw:${OPENCLAW_VERSION:-2026.7.1-2}
  build:
    context: .
    args:
      OPENCLAW_VERSION: ${OPENCLAW_VERSION:-2026.7.1-2}
  environment:
    HOME: /home/node
    OPENCLAW_CONFIG_PATH: /home/node/config/openclaw.json5
    IDEA_TO_JIRA_PLUGIN_PATH: /opt/openclaw-plugins/idea-to-jira
    OPENCLAW_GATEWAY_PORT: "18789"
    OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
    TELEGRAM_PILOT_SENDER_ID: ${TELEGRAM_PILOT_SENDER_ID:?set TELEGRAM_PILOT_SENDER_ID in .env}
    OPENAI_MODEL: ${OPENAI_MODEL:?set OPENAI_MODEL in .env}
    JIRA_BASE_URL: ${JIRA_BASE_URL:?set JIRA_BASE_URL in .env}
    JIRA_TOKEN_FILE: /run/secrets/jira-token
    BUSINESS_ADMIN_TELEGRAM_IDS: ${BUSINESS_ADMIN_TELEGRAM_IDS:?set BUSINESS_ADMIN_TELEGRAM_IDS in .env}
    PRODUCT_OWNER_TELEGRAM_IDS: ${PRODUCT_OWNER_TELEGRAM_IDS:?set PRODUCT_OWNER_TELEGRAM_IDS in .env}
  volumes:
    - ./data/config:/home/node/config
    - ./data/state:/home/node/.openclaw
    - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-./data/auth-profile-secrets}:/home/node/.config/openclaw
    - ./data/workspace:/home/node/workspace
    - ./data/plugin-state:/home/node/plugin-state
    - ./data/secrets:/run/secrets:ro
    - ./knowledge:/app/knowledge:ro
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  openclaw-gateway:
    <<: *openclaw-common
    container_name: idea-to-jira-openclaw
    command: ["gateway", "--bind", "lan", "--port", "18789"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    healthcheck:
      test: ["CMD", "node", "/app/scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  openclaw-cli:
    <<: *openclaw-common
    profiles: ["cli"]
    command: ["status"]
