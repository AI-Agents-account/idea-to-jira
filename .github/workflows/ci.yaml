name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate JSON
        run: npm run validate:json
      - name: Type-check and test
        run: npm run check
      - name: Build plugin
        run: npm run build
      - name: Verify create readiness is fail-closed
        run: npm run verify:create-disabled
      - name: Validate OpenClaw configuration
        env:
          HOME: ${{ runner.temp }}/idea-to-jira-openclaw-validation
          OPENCLAW_CONFIG_PATH: ${{ github.workspace }}/config/openclaw.json5
          IDEA_TO_JIRA_PLUGIN_PATH: ${{ github.workspace }}/packages/idea-to-jira-plugin
          OPENCLAW_GATEWAY_TOKEN: ci-placeholder-gateway-token
          TELEGRAM_BOT_TOKEN: ci-placeholder-telegram-token
          JIRA_BASE_URL: https://jira.example.test
          JIRA_TOKEN: ci-placeholder-jira-token
          BUSINESS_ADMIN_TELEGRAM_IDS: "123456789"
          PRODUCT_OWNER_TELEGRAM_IDS: "987654321"
        run: npm exec -- openclaw config validate
      - name: Validate Compose rendering
        run: docker compose --env-file .env.example config --quiet
      - name: Build target container
        run: docker compose --env-file .env.example build openclaw-gateway
      - name: Verify SQLite durability and mount permissions in target container
        shell: bash
        run: |
          image="idea-to-jira-openclaw:2026.7.1-2"
          runtime_uid="$(docker run --rm --entrypoint id "$image" -u)"
          runtime_gid="$(docker run --rm --entrypoint id "$image" -g)"
          sudo chown -R "$runtime_uid:$runtime_gid" data/plugin-state
          sudo chmod 0700 data/plugin-state
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --mount type=bind,src="$PWD/data/plugin-state",dst=/home/node/.openclaw/plugin-state \
            --entrypoint node "$image" /app/scripts/storage-container-check.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
